tags:
  - Auth
summary: Refresh user session
operationId: refreshUserSession
description: Refresh user session and obtain a new access token. This operation uses `sessionId` and `refreshToken` stored in cookies to generate a new session.
security: []
responses:
  '200':
    description: 'Successfully refreshed a session!'
    content:
      application/json:
        schema:
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: '200'
            message:
              type: string
              example: 'Successfully refreshed a session!'
            data:
              type: object
              required:
                - accessToken
              properties:
                accessToken:
                  type: string
                  example: 'hURY5ShLffeeFEIx84tj49bvvDyyglUuLGZvmmnZ'
  '401':
    $ref: ../../components/responses/401.yaml
  '404':
    $ref: ../../components/responses/404.yaml
  '500':
    $ref: ../../components/responses/500.yaml
