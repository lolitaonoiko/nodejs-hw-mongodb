type: object
required:
  - _id
  - name
  - phoneNumber
  - contactType
  - userId
  - createdAt
  - updatedAt
properties:
  _id:
    description: "Contact's id"
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: "Contact's name"
    type: string
    example: 'John Doe'
  phoneNumber:
    description: "Contact's phone number"
    type: string
    example: 12345
  email:
    description: "Contact's email"
    type: string
    example: example@mail.com
  isFavourite:
    description: 'Whether the contact is a favourite'
    type: boolean
    example: true
    default: false
  contactType:
    description: "Contact's type"
    type: string
    enum: ['work', 'home', 'personal']
    example: home
    default: personal
  userId:
    description: 'User id'
    type: string
    example: 65ca67e7ae7f10c88b598384
  photo:
    description: "Contact's photo"
    type: string
    example: https://res.cloudinary.com/dmsdaszge/image/upload/v1743945821/yl92ioqmr5hq3vlvuasu.jpg
  createdAt:
    description: "Contact's created date"
    type: string
    format: date-time
    example: 2025-04-06T13:23:42.193+00:00
  updatedAt:
    description: "Contact's updated date"
    type: string
    format: date-time
    example: 2025-04-06T13:23:42.193+00:00
