type: object
required:
  - name
  - email
  - password
properties:
  name:
    description: User's name
    type: string
    example: Olena Kozak
  email:
    description: User's email
    type: string
    format: email
    example: example@mail.com
  _id:
    description: User's id
    type: string
    example: 67f952c545041522f39c6ced
  createdAt:
    description: User's created date
    type: string
    format: date-time
    example: 2025-04-06T13:23:42.193+00:00
  updatedAt:
    description: User's updated date
    type: string
    format: date-time
    example: 2025-04-06T13:23:42.193+00:00
